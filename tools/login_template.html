        <style>
            :root{--bg:#F4F8F8;--surface:#FFFFFF;--ink:#1F2A2E;--muted:#666064;--line:#DCE5E6;--accent:#008088;--accent-soft:#E0F1F2;--stop:#C54A4B;
              --f-display:"Outfit","Avenir Next",system-ui,sans-serif;--f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;color-scheme:light}
            @media (prefers-color-scheme:dark){:root{--bg:#0F1719;--surface:#172225;--ink:#E6EEEF;--muted:#A3AEB0;--line:#2A383B;--accent:#4CC3C9;--accent-soft:#163236;--stop:#EE8586;color-scheme:dark}}
            *{box-sizing:border-box}
            html,body{margin:0;min-height:100%}
            body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
              background-image:radial-gradient(circle at 15% 10%,var(--accent-soft) 0,transparent 45%),radial-gradient(circle at 90% 90%,var(--accent-soft) 0,transparent 40%)}
            .hidden{display:none!important}
            .staticrypt-spinner-container{min-height:100vh;display:grid;place-items:center}
            .staticrypt-spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
            @keyframes spin{to{transform:rotate(360deg)}}
            .wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
            .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px 28px;box-shadow:0 12px 40px rgba(0,64,68,.10)}
            .mark{width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 22px var(--f-display);margin-bottom:18px}
            .eyebrow{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
            h1{font:800 28px/1.15 var(--f-display);margin:0 0 8px;letter-spacing:-.01em}
            .lede{color:var(--muted);margin:0 0 24px;font-size:15px}
            label.fl{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
            .pw{position:relative}
            #staticrypt-password{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:13px 48px 13px 14px;outline:none;transition:border-color .15s}
            #staticrypt-password:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
            .staticrypt-toggle-password-visibility{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;cursor:pointer;opacity:.55}
            @media (prefers-color-scheme:dark){.staticrypt-toggle-password-visibility{filter:invert(1)}.staticrypt-decrypt-button,.mark{color:#0F1719}}
            .staticrypt-remember{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:14px;color:var(--muted);cursor:pointer}
            .staticrypt-remember input{width:18px;height:18px;accent-color:var(--accent)}
            .staticrypt-decrypt-button{width:100%;margin-top:22px;font:700 16px var(--f-display);letter-spacing:.02em;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:14px;cursor:pointer;transition:filter .15s}
            .staticrypt-decrypt-button:hover{filter:brightness(1.08)}
            .staticrypt-decrypt-button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
            .foot{margin:20px 0 0;text-align:center;color:var(--muted);font-size:13px}
        </style>

                clearLocalStorageCallback: null,

            // try to automatically decrypt on load if there is a saved password

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been

                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
